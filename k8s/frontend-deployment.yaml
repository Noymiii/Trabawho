apiVersion: apps/v1
kind: Deployment
metadata:
  name: trabawho-frontend
  namespace: trabawho
  labels:
    app: trabawho
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: trabawho
      component: frontend
  template:
    metadata:
      labels:
        app: trabawho
        component: frontend
    spec:
      containers:
        - name: frontend
          image: trabawho-frontend:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
