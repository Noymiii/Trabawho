version: '3.8'

services:
  mysql:
    image: mysql:8
    container_name: trabawho-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: trabawho_pass
      MYSQL_DATABASE: trabawho
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: trabawho-backend
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: trabawho
      DB_USER: root
      DB_PASSWORD: trabawho_pass
      JWT_SECRET: trabawho_jwt_secret_change_in_production
      JWT_EXPIRES_IN: 24h
      PORT: 5000
      FRONTEND_URL: http://localhost:3000
      NODE_ENV: production
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: trabawho-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data:
